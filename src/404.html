        <div class="toolbar">

    <main class="demo-view">

                        <a class="btn btn-small btn-primary" href="/?demo=1&view=duel&sample=classic_demo&draw=5">Load sample + draw 5</a>
                        <a class="btn btn-small" href="/?demo=1&view=duel">Play now</a>

                </div>

                        <div class="demo-sub" style="margin-top:10px;">If you were given a link, ask the host for the current demo URL.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
